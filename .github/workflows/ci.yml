name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test
        run: xcodebuild -project SlicerRouter.xcodeproj -scheme SlicerRouter -derivedDataPath build/DerivedData test
      - name: Build Release
        run: xcodebuild -project SlicerRouter.xcodeproj -scheme SlicerRouter -configuration Release -derivedDataPath build/DerivedData build
      - name: Package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: 3dSlicerRouter
          path: build/3dSlicerRouter.zip
