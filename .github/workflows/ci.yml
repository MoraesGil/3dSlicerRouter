name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build, verify signatures and test
        run: ./scripts/build.sh --test
      - name: Package
        run: ./scripts/package.sh
      - name: Verify downloadable packages
        run: ./scripts/verify-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: 3dSlicerRouter
          path: |
            build/3dSlicerRouter.dmg
            build/3dSlicerRouter.zip
            build/SHA256SUMS
