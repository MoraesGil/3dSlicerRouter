name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches the app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/.*MARKETING_VERSION: "\([^"]*\)".*/\1/p' project.yml)
          [[ -n "$VERSION" && "$RELEASE_TAG" == "v$VERSION" ]] || {
            echo "Tag $RELEASE_TAG must match project.yml version $VERSION" >&2
            exit 1
          }
      - name: Build universal app, verify signatures and test
        run: ./scripts/build.sh --native --test
      - name: Package DMG and ZIP
        run: ./scripts/package.sh
      - name: Verify downloadable packages
        run: ./scripts/verify-package.sh
      - name: Publish release after uploading all downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Install on macOS 14 or newer

          Download **3dSlicerRouter.dmg** below. It includes the app for both Apple silicon and Intel. No Xcode, Homebrew or Terminal is needed.

          1. Open the DMG and drag **3dSlicerRouter** to **Applications**.
          2. Eject the disk image and open the app from **Applications**.
          3. Choose **Use for .3mf and .gcode**. Keep at least one slicer installed.

          **Signing:** this release is ad-hoc signed, not Developer ID signed or notarized. macOS can block the first launch. If you trust the download, use Apple's per-app [Open Anyway instructions](https://support.apple.com/102445). Managed Macs may prevent approval. Do not disable Gatekeeper or remove quarantine. Background indexing remains experimental; routing and on-demand previews work independently.

          ## Instalar no macOS 14 ou mais novo

          Baixe **3dSlicerRouter.dmg** abaixo. O app inclui Apple silicon e Intel. Você não precisa de Xcode, Homebrew nem Terminal.

          1. Abra o DMG e arraste **3dSlicerRouter** para **Applications**.
          2. Ejete a imagem e abra o app em **Aplicativos**.
          3. Escolha **Usar para .3mf e .gcode**. Mantenha um fatiador instalado.

          **Assinatura:** esta versão usa assinatura ad-hoc, sem Developer ID nem notarização. O macOS pode bloquear a primeira abertura. Se você confia no download, siga as [instruções da Apple para Abrir Mesmo Assim](https://support.apple.com/102445). Macs gerenciados podem impedir essa autorização. Não desative o Gatekeeper nem remova a quarentena. A indexação em background continua experimental; o roteamento e os previews sob demanda são independentes.

          The ZIP is an alternative download. SHA256SUMS contains both file checksums.
          O ZIP é uma alternativa. SHA256SUMS contém os hashes dos dois arquivos.
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json"; then
            python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["isDraft"] else "Refusing to overwrite a published release")' \
              "$RUNNER_TEMP/existing-release.json"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "3dSlicerRouter ${RELEASE_TAG#v}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            build/3dSlicerRouter.dmg build/3dSlicerRouter.zip build/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest
