name: SlicerRouter
options:
  bundleIdPrefix: com.moraesdev
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "1.5.1"
    CURRENT_PROJECT_VERSION: "16"
targets:
  SlicerRouter:
    type: application
    platform: macOS
    sources:
      - Sources/Core
      - Sources/App
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/LaunchAgents/com.moraesdev.3dslicerrouter.previews.v2.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: 3dSlicerRouter
        CFBundleDisplayName: 3dSlicerRouter
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: moraesdev
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.3mf.3mf
            UTTypeDescription: 3MF Project
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [3mf, 3MF]
              public.mime-type: [model/3mf]
          - UTTypeIdentifier: com.moraesdev.gcode
            UTTypeDescription: G-code
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [gcode, GCODE]
        CFBundleDocumentTypes:
          - CFBundleTypeName: 3MF Project
            CFBundleTypeIconFile: AppIcon
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [org.3mf.3mf]
          - CFBundleTypeName: G-code
            CFBundleTypeIconFile: AppIcon
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.moraesdev.gcode]
    settings:
      base:
        PRODUCT_NAME: 3dSlicerRouter
        PRODUCT_MODULE_NAME: SlicerRouter
        PRODUCT_BUNDLE_IDENTIFIER: com.moraesdev.3dslicerrouter
    dependencies:
      - target: SlicerRouterIndexer
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: SlicerRouterThumbnail
        embed: true
        codeSign: true
      - target: SlicerRouterPreview
        embed: true
        codeSign: true
  SlicerRouterIndexer:
    type: tool
    platform: macOS
    sources:
      - Sources/Core
      - Sources/App/Store.swift
      - Sources/App/Indexer.swift
      - Sources/Indexer
    settings:
      base:
        PRODUCT_NAME: 3dSlicerIndexer
        PRODUCT_MODULE_NAME: SlicerRouterIndexer
        SKIP_INSTALL: YES
  SlicerRouterThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - Sources/Core
      - Sources/Thumbnail
    info:
      path: Sources/Thumbnail/Info.plist
      properties:
        CFBundleDisplayName: 3dSlicerRouter Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [org.3mf.3mf, com.moraesdev.gcode]
            QLThumbnailMinimumDimension: 0
    entitlements:
      path: Sources/Thumbnail/Thumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/3dSlicerRouter/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moraesdev.3dslicerrouter.thumbnail
        PRODUCT_MODULE_NAME: SlicerRouterThumbnail
        CODE_SIGN_ENTITLEMENTS: Sources/Thumbnail/Thumbnail.entitlements
  SlicerRouterPreview:
    type: app-extension
    platform: macOS
    sources:
      - Sources/Core
      - Sources/Preview
    info:
      path: Sources/Preview/Info.plist
      properties:
        CFBundleDisplayName: 3dSlicerRouter Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [org.3mf.3mf, com.moraesdev.gcode]
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    entitlements:
      path: Sources/Preview/Preview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/3dSlicerRouter/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moraesdev.3dslicerrouter.preview
        PRODUCT_MODULE_NAME: SlicerRouterPreview
        CODE_SIGN_ENTITLEMENTS: Sources/Preview/Preview.entitlements
  SlicerRouterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources/Core
      - Sources/App/Store.swift
      - Sources/App/Indexer.swift
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SlicerRouter:
    build:
      targets:
        SlicerRouter: all
    test:
      targets: [SlicerRouterTests]
